<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тракт — визуальный тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oswald:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;background:#121016;
  font-family:'Dela Gothic One','Russo One',Impact,sans-serif;color:#efe6d2;user-select:none;--fx:#ff2e88}
#stage.threat{--fx:#ffc93c}
canvas{position:absolute;left:0;top:0;width:1280px;height:720px}
.ui{position:absolute;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}
.hide{display:none!important}
small,.os{font-family:Oswald,'Arial Narrow',sans-serif}

.plate{position:absolute;left:-24px;top:40px;padding:10px 54px 14px 60px;background:#121016;
  transform:skewX(-14deg) rotate(-3deg);box-shadow:12px 9px 0 var(--fx)}
.plate>*{display:block;transform:skewX(14deg)}
.plate b{font-size:56px;line-height:1;font-weight:400}
.plate span{font:700 17px Oswald,sans-serif;letter-spacing:.24em;color:var(--fx);text-transform:uppercase;margin-top:4px}
#hint{position:absolute;right:26px;bottom:18px;font:500 15px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  background:#121016;padding:5px 16px;transform:skewX(-14deg)}
#hint b{font-family:inherit;color:var(--fx)}

#shout{position:absolute;right:70px;top:120px;padding:14px 34px 18px;background:#efe6d2;color:#121016;font-size:44px;line-height:1.05;
  transform:rotate(4deg) skewX(-8deg);box-shadow:-10px 10px 0 #121016;animation:pop .18s cubic-bezier(.2,1.6,.4,1)}
#shout small{display:block;font:700 15px Oswald,sans-serif;letter-spacing:.24em;margin-bottom:4px;color:#7a2cff}
@keyframes pop{from{transform:rotate(14deg) skewX(-8deg) scale(.2)}}

#party{position:absolute;left:30px;top:20px;display:flex;gap:12px}
.pc{width:140px;padding:5px 14px 9px;background:#121016;transform:skewX(-12deg);border-left:10px solid var(--c);
  transition:transform .12s,background .12s}
.pc>*{display:block;transform:skewX(12deg)}
.pc b{font-size:19px;font-weight:400;line-height:1.3}
.pc span{font:700 13px Oswald,sans-serif;letter-spacing:.1em}
.pc .hp{height:8px;background:#3b3542;margin-top:3px;transform:none}
.pc .hp i{display:block;height:100%;background:var(--c);transition:width .3s}
.pc.act{background:#efe6d2;color:#121016;transform:skewX(-12deg) translateY(12px) scale(1.1);box-shadow:6px 6px 0 var(--fx)}

#foe{position:absolute;right:30px;top:22px;width:300px;padding:6px 18px 10px;background:#121016;transform:skewX(12deg);
  border-right:10px solid #ffc93c;text-align:right}
#foe>*{display:block;transform:skewX(-12deg)}
#foe b{font-size:22px;font-weight:400}
#foe .hp{height:8px;background:#3b3542;margin-top:4px;transform:none}
#foe .hp i{display:block;height:100%;background:#ffc93c;margin-left:auto;transition:width .3s}

#menu{position:absolute;left:650px;top:190px}
#who{font-size:17px;background:#efe6d2;color:#121016;padding:3px 16px;width:max-content;transform:skewX(-12deg) rotate(-5deg);
  margin:0 0 12px -18px;border-left:10px solid var(--c)}
.cmd{position:relative;margin:9px 0 9px var(--m);padding:3px 30px 6px 22px;font-size:29px;background:#121016;color:#efe6d2;
  width:max-content;transform:skewX(-12deg) rotate(var(--r));cursor:pointer;transition:transform .08s;box-shadow:5px 5px 0 #efe6d2}
.cmd small{font:700 12px Oswald,sans-serif;letter-spacing:.2em;display:block;opacity:.75;text-transform:uppercase;margin-top:-3px}
.cmd.sel{background:var(--fx);color:#121016;transform:skewX(-12deg) rotate(var(--r)) scale(1.24) translateX(30px);
  box-shadow:8px 8px 0 #121016;z-index:2}
.cmd.sel::before{content:'';position:absolute;left:-34px;top:50%;border:13px solid transparent;border-left:20px solid #efe6d2;margin-top:-13px}

#wipe{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#wipe i{position:absolute;top:-20%;left:0;width:150%;height:140%;transform:translateX(-135%) skewX(-18deg)}
#wipe.go i{animation:wipe .7s cubic-bezier(.7,0,.3,1) forwards}
#wipe i:nth-child(1){background:#efe6d2}
#wipe i:nth-child(2){background:var(--fx);animation-delay:.07s}
#wipe i:nth-child(3){background:#121016;animation-delay:.14s}
@keyframes wipe{0%{transform:translateX(-135%) skewX(-18deg)}45%,55%{transform:translateX(-18%) skewX(-18deg)}100%{transform:translateX(115%) skewX(-18deg)}}

#win{position:absolute;inset:0;background:#ff2e88;overflow:hidden;
  background-image:repeating-linear-gradient(-62deg,transparent 0 70px,rgba(18,16,22,.13) 70px 140px)}
#win h1{position:absolute;left:40px;top:120px;margin:0;font-size:132px;line-height:.92;font-weight:400;color:#121016;
  transform:rotate(-7deg);text-shadow:8px 8px 0 #efe6d2;animation:slideL .35s cubic-bezier(.2,1.3,.4,1)}
#win .box{position:absolute;right:60px;bottom:70px;background:#121016;padding:18px 44px 22px;transform:skewX(-12deg) rotate(-3deg);
  box-shadow:12px 12px 0 #efe6d2;animation:slideR .45s cubic-bezier(.2,1.3,.4,1)}
#win .box>*{display:block;transform:skewX(12deg)}
#win .box b{font-size:30px;font-weight:400}
#win .box span{font:700 17px Oswald,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#ff2e88;margin-top:6px}
@keyframes slideL{from{transform:rotate(-7deg) translateX(-900px)}}
@keyframes slideR{from{transform:skewX(-12deg) rotate(-3deg) translateX(900px)}}
#btnSquad{position:absolute;left:26px;bottom:18px;font:500 15px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  background:#efe6d2;color:#121016;padding:5px 18px;transform:skewX(-14deg);cursor:pointer;box-shadow:5px 5px 0 var(--fx)}
.pc{cursor:pointer}
#sheet{position:absolute;inset:0;background:rgba(18,16,22,.92);overflow:hidden;font-family:Oswald,sans-serif;pointer-events:auto}
#shBand{position:absolute;left:-120px;top:-40px;width:520px;height:800px;background:var(--c);transform:skewX(-12deg);box-shadow:14px 0 0 #efe6d2}
#shPic{position:absolute;left:0;bottom:-14px;width:440px;height:690px;object-fit:contain;object-position:50% 100%;filter:drop-shadow(10px 8px 0 #121016)}
#shX{position:absolute;right:22px;top:14px;font:400 22px 'Dela Gothic One';padding:0 12px 4px;background:#efe6d2;color:#121016;transform:skewX(-12deg);cursor:pointer}
#shTabs{position:absolute;left:480px;top:20px;display:flex;gap:10px}
#shTabs i{font:400 16px 'Dela Gothic One';font-style:normal;padding:3px 16px 5px;background:#121016;border-left:8px solid var(--c);
  transform:skewX(-12deg);cursor:pointer;box-shadow:inset 0 0 0 2px #3b3542}
#shTabs i.on{background:#efe6d2;color:#121016;box-shadow:5px 5px 0 var(--fx)}
#shTabs u{text-decoration:none;background:var(--fx);color:#121016;margin-left:8px;padding:0 6px;font:700 13px Oswald,sans-serif}
#shHead{position:absolute;left:480px;top:72px}
#shHead b{display:block;font:400 60px/1 'Dela Gothic One';transform:rotate(-2deg);transform-origin:left}
#shHead span{display:block;font:700 15px Oswald,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--fx);margin-top:10px}
.xp{width:320px;height:8px;background:#3b3542;margin-top:6px}.xp i{display:block;height:100%;background:var(--fx)}
#shStats{position:absolute;left:488px;top:202px;width:310px}
#shStats div{display:flex;align-items:baseline;gap:10px;padding:5px 14px;margin-bottom:6px;background:#121016;transform:skewX(-12deg);border-left:8px solid var(--c)}
#shStats div>*{transform:skewX(12deg)}
#shStats span{flex:1;font:700 14px Oswald,sans-serif;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
#shStats b{font:400 24px 'Dela Gothic One'}
#shStats em{font:700 15px Oswald,sans-serif;font-style:normal;color:#7dffb0}
#shStats .sk b{font-size:15px}
#shGear{position:absolute;left:846px;top:76px;width:400px}
.sh-t{font:400 20px 'Dela Gothic One';margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sh-t small{font:700 14px Oswald,sans-serif;letter-spacing:.16em;color:var(--fx);text-transform:uppercase}
.slot{display:grid;grid-template-columns:96px 1fr;align-items:center;column-gap:10px;padding:4px 14px 5px;margin-bottom:6px;min-height:40px;box-sizing:border-box;
  background:#efe6d2;color:#121016;transform:skewX(-12deg);cursor:pointer}
.slot>*{transform:skewX(12deg)}
.slot span{grid-row:1/3;font:700 12px Oswald,sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.65}
.slot b{font:700 17px/1.15 Oswald,sans-serif}
.slot small{font:700 12px Oswald,sans-serif;letter-spacing:.08em;color:#b0125a}
.slot.empty{background:#121016;color:#efe6d2;box-shadow:inset 0 0 0 2px #3b3542}
.slot.empty b{opacity:.5}
#sheet.ro .slot,#sheet.ro .node{cursor:default}
#sheet:not(.ro) .slot:hover,.node.av:hover{box-shadow:6px 6px 0 var(--fx)}
.sh-none{font:500 15px Oswald,sans-serif;letter-spacing:.1em;opacity:.6;margin:6px 0 12px}
#shTree{position:absolute;left:488px;top:412px;width:758px}
.branch{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.branch>span{width:126px;font:400 15px 'Dela Gothic One'}
.node{flex:1;padding:6px 14px 8px;background:#121016;transform:skewX(-12deg);box-shadow:inset 0 0 0 2px #3b3542;opacity:.5}
.node>*{display:block;transform:skewX(12deg)}
.node b{font:700 16px Oswald,sans-serif}
.node small{font:700 12px Oswald,sans-serif;letter-spacing:.08em;color:var(--fx)}
.node.on{background:#efe6d2;color:#121016;opacity:1;box-shadow:inset 8px 0 0 var(--c)}
.node.on small{color:#b0125a}
.node.av{opacity:1;cursor:pointer;animation:pulse .7s infinite alternate}
@keyframes pulse{from{box-shadow:inset 0 0 0 2px var(--fx)}to{box-shadow:inset 0 0 0 5px var(--fx)}}
#shFoot{position:absolute;left:488px;right:30px;bottom:16px;display:flex;justify-content:space-between;font:500 14px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
#shFoot b{font-family:inherit;color:var(--fx)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>

  <div class="ui" id="uiRoad">
    <div class="plate"><b>ТРАКТ</b><span>отрезок 01 · закатная верста</span></div>
    <div id="hint"><b>Пробел</b> — встреча &nbsp;·&nbsp; <b>I</b> — отряд &nbsp;·&nbsp; <b>X</b> — опыт (тест) &nbsp;·&nbsp; <b>T</b> — палитра &nbsp;·&nbsp; <b>B</b> — фон</div>
    <div id="btnSquad">Отряд</div>
  </div>
  <div class="ui hide" id="uiShout"><div id="shout"><small>МЫТАРЬ ТРАКТА</small>ПЛАТИ<br>ЗА ПРОЕЗД</div></div>

  <div class="ui hide" id="uiBattle">
    <div id="party"></div>
    <div id="foe"><b>МЫТАРЬ ТРАКТА</b><div class="hp"><i id="foeHp" style="width:100%"></i></div></div>
    <div id="menu" class="hide"><div id="who"></div><div id="cmds"></div></div>
  </div>

  <div class="ui hide" id="win">
    <h1>ПУТЬ<br>СВОБОДЕН</h1>
    <div class="box"><b>Мытарь остался без пошлины</b><span id="winStat"></span><span id="winLoot"></span><span>Пробел — дальше по Тракту</span></div>
  </div>
  <div class="ui hide" id="sheet"></div>
  <div id="wipe"><i></i><i></i><i></i></div>
</div>

<script>
'use strict';
const W=1280,H=720,SS=1.5,LW=2560,D=Math.PI/180;
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
const FONT='"Dela Gothic One","Russo One",Impact,sans-serif';
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* ---------- palettes ---------- */
const PAL={
  calm:{bands:['#7fdcc0','#a2e9c8','#cdf3c6'],sun:'#fff6d0',haze:'#f1e3a4',cloud:'#fff4dc',cloudSh:'#f6cfa6',farLit:'#f8cd7c',farShade:'#f0a063',
    lit:'#ffd447',shade:'#f08a3c',shade2:'#d6336c',deep:'#d6336c',roof:'#d6336c',sand:'#f7b955',ground:'#f39a45',road:'#fbe2a0',strip:'#b3245a',plant:'#7a1846',
    near:'#b3245a',ink:'#121016',paper:'#efe6d2',skin:'#f2cda6',fx:'#ff2e88',mote:'#fffbe6'},
  threat:{bands:['#140530','#2a0f5c','#4b1a9a'],sun:'#ffc93c',haze:'#3a1277',cloud:'#7a2cff',cloudSh:'#5b1fb0',farLit:'#5b1fb0',farShade:'#3a1277',
    lit:'#ffc93c',shade:'#e0563a',shade2:'#3a1277',deep:'#8a1454',roof:'#ff2e88',sand:'#3a1277',ground:'#2a0d57',road:'#c9962a',strip:'#0c0420',plant:'#0c0420',
    near:'#0c0420',ink:'#090212',paper:'#ffe9a8',skin:'#b993ff',fx:'#ffc93c',mote:'#ffc93c'}
};
let mode='calm';
const P=()=>PAL[mode];
function setMode(m){mode=m;stage.classList.toggle('threat',m==='threat');}

/* ---------- background layers ---------- */
function buildLayers(p){
  const R=rng(11),ink=p.ink;
  const pth=(c,pts)=>{c.beginPath();pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();};
  const shp=(c,pts,fill,lw)=>{pth(c,pts);c.fillStyle=fill;c.fill();if(lw!==0){c.strokeStyle=ink;c.lineWidth=lw||2.5;c.lineJoin='round';c.stroke();}};
  const hatch=(c,pts,gap,a)=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;pts.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);});
    c.save();pth(c,pts);c.clip();c.strokeStyle=ink;c.lineWidth=1.3;c.globalAlpha=a||.5;c.beginPath();const h=y1-y0;
    for(let x=x0-h*.5;x<x1;x+=gap||7){c.moveTo(x,y1);c.lineTo(x+h*.5,y0);}c.stroke();c.restore();};
  // box split into a lit (right) and a shaded (left) plane
  const block=(c,l,r,top,bot,k,lw)=>{const m=l+(r-l)*(k||.38);const sh=[[l,bot],[l,top],[m,top],[m,bot]];
    shp(c,[[m,bot],[m,top],[r,top],[r,bot]],p.lit,0);shp(c,sh,p.shade,0);hatch(c,sh,7,.45);
    c.strokeStyle=ink;c.lineWidth=lw||2.5;c.strokeRect(l,top,r-l,bot-top);c.lineWidth=1.2;c.beginPath();c.moveTo(m,top);c.lineTo(m,bot);c.stroke();};
  const arch=(c,x,y,w,h,fill)=>{c.beginPath();c.moveTo(x-w/2,y);c.lineTo(x-w/2,y-h+w/2);c.arc(x,y-h+w/2,w/2,Math.PI,0);c.lineTo(x+w/2,y);c.closePath();c.fillStyle=fill;c.fill();c.strokeStyle=ink;c.lineWidth=1.6;c.stroke();};
  const cloud=(c,x,y,s,fill,sh)=>{const bl=[[0,0,34],[40,-18,42],[88,-6,36],[124,6,24],[-34,8,22]];
    c.save();c.beginPath();c.rect(x-220*s,y-220*s,440*s,242*s);c.clip();c.strokeStyle=ink;c.lineWidth=5;
    bl.forEach(b=>{c.beginPath();c.arc(x+b[0]*s,y+b[1]*s,b[2]*s,0,7);c.stroke();});
    c.fillStyle=fill;bl.forEach(b=>{c.beginPath();c.arc(x+b[0]*s,y+b[1]*s,b[2]*s,0,7);c.fill();});
    c.fillStyle=sh;bl.forEach(b=>{c.beginPath();c.arc(x+(b[0]-5)*s,y+(b[1]+17)*s,b[2]*s*.8,0,7);c.fill();});
    c.restore();c.strokeStyle=ink;c.lineWidth=2.5;c.beginPath();c.moveTo(x-55*s,y+22*s);c.lineTo(x+146*s,y+22*s);c.stroke();};

  /* sky */
  const sky=mk(W,H),s=sky.getContext('2d');
  const by=[0,150,320,H];p.bands.forEach((b,i)=>{s.fillStyle=b;s.fillRect(0,by[i],W,by[i+1]-by[i]);});
  for(let k=1;k<3;k++){s.fillStyle=p.bands[k-1];for(let row=0;row<6;row++){const y=by[k]+5+row*11,r=5.2-row*.85;
    for(let x=(row%2)*6;x<W;x+=12){s.beginPath();s.arc(x,y,r,0,7);s.fill();}}}
  s.fillStyle=p.sun;s.strokeStyle=ink;s.lineWidth=2.5;s.beginPath();s.arc(930,300,122,0,7);s.fill();s.stroke();
  s.lineWidth=1.2;s.beginPath();s.arc(930,300,150,0,7);s.stroke();s.setLineDash([3,9]);s.beginPath();s.arc(930,300,182,0,7);s.stroke();s.setLineDash([]);
  [[-40,300,455],[250,210,470],[520,330,440],[900,260,462],[1120,240,448]].forEach(m=>{const[x,w,t]=m;
    shp(s,[[x,560],[x+w*.07,t+26],[x+w*.14,t],[x+w*.82,t],[x+w*.9,t+34],[x+w,560]],p.haze,1.5);
    s.lineWidth=1;s.globalAlpha=.4;for(let i=1;i<4;i++){s.beginPath();s.moveTo(x+w*.12,t+i*24);s.lineTo(x+w*.9,t+i*24+4);s.stroke();}s.globalAlpha=1;});

  /* clouds */
  const clouds=mk(LW,H),cl=clouds.getContext('2d');
  for(let i=0;i<8;i++)cloud(cl,140+i*310+R()*90,70+R()*170,.7+R()*.8,p.cloud,p.cloudSh);

  /* far: mesas, pylons, a distant tower */
  const far=mk(LW,H),f=far.getContext('2d');
  for(let i=0;i<8;i++){const x=40+i*318+R()*40,w=190+R()*110,t=385+R()*70,b=540;
    const out=[[x,b],[x+w*.07,t+34],[x+w*.15,t],[x+w*.8,t],[x+w*.9,t+46],[x+w,b]];
    const sh=[[x,b],[x+w*.07,t+34],[x+w*.15,t],[x+w*.36,t],[x+w*.3,t+60],[x+w*.33,b]];
    shp(f,out,p.farLit,0);shp(f,sh,p.farShade,0);hatch(f,sh,9,.35);pth(f,out);f.strokeStyle=ink;f.lineWidth=2;f.stroke();
    f.lineWidth=1;f.globalAlpha=.45;for(let j=1;j<4;j++){f.beginPath();f.moveTo(x+w*.36,t+j*30);f.quadraticCurveTo(x+w*.6,t+j*30+7,x+w*.88,t+j*30+2);f.stroke();}f.globalAlpha=1;}
  f.strokeStyle=ink;for(let i=0;i<5;i++){const px=1180+i*170;f.lineWidth=1.8;f.beginPath();f.moveTo(px-18,540);f.lineTo(px,318);f.lineTo(px+18,540);
    f.moveTo(px-32,340);f.lineTo(px+32,340);f.moveTo(px-22,366);f.lineTo(px+22,366);
    for(let j=0;j<4;j++){const y0=390+j*38;f.moveTo(px-7-j*3,y0);f.lineTo(px+10+j*3,y0+38);f.moveTo(px+7+j*3,y0);f.lineTo(px-10-j*3,y0+38);}f.stroke();
    if(i<4){f.lineWidth=1;f.beginPath();f.moveTo(px-32,340);f.quadraticCurveTo(px+53,378,px+138,340);f.moveTo(px+32,340);f.quadraticCurveTo(px+117,382,px+202,340);f.stroke();}}
  f.fillStyle=p.farLit;f.fillRect(0,528,LW,H);f.strokeStyle=ink;f.lineWidth=2;f.beginPath();f.moveTo(0,528);f.lineTo(LW,528);f.stroke();

  /* mid: the monuments of the Tract */
  const mid=mk(LW,H),m=mid.getContext('2d');
  const hill=x=>{const k=x/LW*Math.PI*2;return 548-14*Math.sin(k*5)-8*Math.sin(k*11+1);};
  // windmill
  {const x=170,b=575;shp(m,[[x-34,b],[x-16,350],[x+16,350],[x+34,b]],p.lit);const sh=[[x-34,b],[x-16,350],[x-2,350],[x-6,b]];shp(m,sh,p.shade,0);hatch(m,sh,7,.45);
    shp(m,[[x-22,350],[x,318],[x+22,350]],p.roof);arch(m,x+10,b-30,16,34,p.deep);
    for(let i=0;i<4;i++){m.save();m.translate(x,346);m.rotate(.45+i*Math.PI/2);shp(m,[[-3,0],[3,0],[3,118],[-3,118]],ink,0);shp(m,[[4,30],[34,30],[34,114],[4,114]],p.cloud,2);

function openSheet(i){
  if(sheetOpen||scene==='win'||(scene==='road'&&!walking)||(scene==='battle'&&busy))return;
  sheetOpen=true;shSlot=null;shI=i!=null?i:active?heroes.indexOf(active):shI;paintSheet();show('sheet',true);if(scene==='road')show('uiRoad',false);}
function closeSheet(){sheetOpen=false;show('sheet',false);if(scene==='road')show('uiRoad',true);if(scene==='battle')paintUI();}
function paintSheet(){
  const h=heroes[shI],d=h.def,s=statsOf(h),edit=scene==='road',tree=d.tree||TREE,el=$('sheet');
  const key=Object.keys(DEFS).find(k=>DEFS[k]===d),src=SPRITES[key]&&SPRITES[key].idle;
  el.style.setProperty('--c',d.c);el.classList.toggle('ro',!edit);
  let gear;
  if(shSlot){const lab=SLOTS.find(x=>x[0]===shSlot)[1],fit=bag.filter(id=>ITEMS[id].s===shSlot);
    gear=`<div class="sh-t">${lab}<small>выбор из сумки</small></div>`
      +(fit.length?fit.map(id=>`<div class="slot" data-it="${id}"><span>надеть</span><b>${ITEMS[id].n}</b><small>${bonus(ITEMS[id])}</small></div>`).join(''):'<div class="sh-none">В сумке нет ничего для этого слота</div>')
      +(h.gear[shSlot]?`<div class="slot empty" data-it=""><span>снять</span><b style="opacity:1">${ITEMS[h.gear[shSlot]].n}</b></div>`:'')
      +'<div class="slot empty" data-x="back"><span>назад</span><b style="opacity:1">к снаряжению</b></div>';
  }else{const n=SLOTS.filter(([k])=>h.gear[k]).length;
    gear=`<div class="sh-t">СНАРЯЖЕНИЕ<small>${n} / ${SLOTS.length} · в сумке ${bag.length}</small></div>`
      +SLOTS.map(([k,lab])=>{const it=ITEMS[h.gear[k]];return`<div class="slot ${it?'':'empty'}" data-s="${k}"><span>${lab}</span><b>${it?it.n:'пусто'}</b>${it?`<small>${bonus(it)}</small>`:''}</div>`;}).join('');}
  el.innerHTML=`<div id="shBand"></div>${src?`<img id="shPic" src="${src}" alt="">`:''}
    <div id="shX" data-x="close">✕</div>
    <div id="shTabs">${heroes.map((x,i)=>`<i class="${i===shI?'on':''}" data-h="${i}" style="--c:${x.def.c}">${x.def.name}${x.pts?`<u>${x.pts}</u>`:''}</i>`).join('')}</div>
    <div id="shHead"><b>${d.name}</b><span>уровень ${h.lvl} · опыт ${h.xp} / ${xpNeed(h)}</span><div class="xp"><i style="width:${h.xp/xpNeed(h)*100}%"></i></div></div>
    <div id="shStats">${Object.keys(STAT).map(k=>`<div><span>${STAT[k]}</span><b>${s[k]}</b>${s.add[k]?`<em>+${s.add[k]}</em>`:''}</div>`).join('')}<div class="sk"><span>приём</span><b>${d.skill}</b></div></div>
    <div id="shGear">${gear}</div>
    <div id="shTree"><div class="sh-t">РАЗВИТИЕ<small>${h.pts?'свободных очков: '+h.pts:'очко даётся за уровень'}</small></div>
      ${tree.map((b,bi)=>`<div class="branch"><span>${b.n}</span>${b.nodes.map((nd,j)=>{const on=j<h.learned[bi],av=edit&&h.pts>0&&j===h.learned[bi];
        return`<div class="node ${on?'on':av?'av':''}"${av?` data-n="${bi}"`:''}><b>${nd.n}</b><small>${bonus(nd)}</small></div>`;}).join('')}</div>`).join('')}</div>
    <div id="shFoot"><span><b>← →</b> герой &nbsp;·&nbsp; <b>I</b> / <b>Esc</b> закрыть${edit?'':' &nbsp;·&nbsp; в бою только просмотр'}</span><span>предметы и ветки — заглушки</span></div>`;
}
$('sheet').addEventListener('click',e=>{
  const t=e.target.closest('[data-h],[data-s],[data-it],[data-n],[data-x]');if(!t)return;
  const h=heroes[shI],ds=t.dataset;
  if(ds.x==='close')return closeSheet();
  if(ds.h!=null){shI=+ds.h;shSlot=null;}
  else if(ds.x==='back')shSlot=null;
  else if(scene!=='road')return;
  else if(ds.s)shSlot=ds.s;
  else if(ds.it!=null){const cur=h.gear[shSlot];if(cur)bag.push(cur);
    if(ds.it){bag.splice(bag.indexOf(ds.it),1);h.gear[shSlot]=ds.it;}else delete h.gear[shSlot];shSlot=null;recalc(h);}
  else if(ds.n!=null){const b=+ds.n;if(h.pts>0&&h.learned[b]<(h.def.tree||TREE)[b].nodes.length){h.pts--;h.learned[b]++;recalc(h);}}
  paintSheet();
});
$('btnSquad').addEventListener('click',()=>openSheet());

/* ---------- flow ---------- */
function boom(target,dmg,big){
  const tx=target.x+target.ox+(target.flip?-10:10),ty=target.y-190*target.sc;
  target.hp=Math.max(target===foe?0:1,target.hp-dmg);target.pose='hit';target.flash=1;target.flashCol=P().paper;
  shake=big?30:16;lines=big?1:.7;lineFocus=[tx,ty+40];flash=big?.7:.35;flashCol=P().paper;freezeUntil=performance.now()+(big?150:90);
  sfxs.push({text:pick(big?['ХРЯСЬ!','ГРОХ!','БА-БАХ!']:['БАХ!','ДЗЫНЬ!','ШМЯК!','ТРЕСЬ!']),x:tx+(target.flip?-150:130),y:ty-70,size:big?108:76,rot:(Math.random()-.5)*.5,t0:time,dur:big?.85:.6});
  nums.push({text:String(dmg),x:tx,y:ty,size:big?72:52,t0:time});
  setTimeout(()=>{if(target.hp>0)target.pose='idle';},big?520:340);paintUI();
}
async function choose(){
  if(busy||scene!=='battle')return;busy=true;const h=active,c=sel;show('menu',false);turns++;
  if(c===0||c===1){const big=c===1;
    if(big){setMode('threat');cut={h,t0:time,dur:1.15};await wait(1150);}
    await tw(h,'ox',foe.x-h.x-200,130);h.pose='atk';boom(foe,Math.round((big?ri(34,42):ri(16,22))*h.atk/10),big);
    await wait(big?560:340);h.pose='idle';await tw(h,'ox',0,200);setMode('calm');
  }else if(c===2){h.pose='guard';sfxs.push({text:'СТОЙКА',x:h.x+40,y:h.y-330,size:44,rot:-.12,t0:time,dur:.6,col:h.def.c});await wait(450);}
  else{h.hp=Math.min(h.max,h.hp+20);h.flash=.9;h.flashCol='#7dffb0';nums.push({text:'+20',x:h.x,y:h.y-260,size:50,t0:time,col:'#7dffb0'});
    sfxs.push({text:'ГЛОТЬ',x:h.x+70,y:h.y-330,size:44,rot:.1,t0:time,dur:.6,col:'#7dffb0'});paintUI();await wait(500);}
  next();
}
let turn=0;
async function next(){
  active=null;paintUI();
  if(foe.hp<=0)return victory();
  turn++;
  if(turn<=4){const h=heroes[turn-1];if(h.pose==='guard')h.pose='idle';return showMenu(h);}
  turn=0;setMode('threat');await wait(650);
  const h=pick(heroes),guard=h.pose==='guard';
  await tw(foe,'ox',-(foe.x-h.x-210),170);foe.pose='atk';{const raw=ri(12,18)+wins*3;boom(h,Math.max(1,(guard?Math.round(raw*.4):raw)-h.arm),false);}if(guard)setTimeout(()=>h.pose='guard',350);
  await wait(420);foe.pose='idle';await tw(foe,'ox',0,220);setMode('calm');await wait(150);next();
}
async function victory(){
  setMode('threat');foe.pose='hit';lines=1;lineFocus=[foe.x,foe.y-280];
  sfxs.push({text:'УПЛАЧЕНО',x:640,y:310,size:92,rot:-.1,t0:time,dur:1.3});
  tw(foe,'alpha',0,900);tw(foe,'oy',-90,900);await wait(1300);
  wins++;const ups=heroes.map(h=>gainXp(h,XP_WIN)).some(Boolean);
  const loot=lootPool.length?lootPool.splice(Math.floor(Math.random()*lootPool.length),1)[0]:null;if(loot)bag.push(loot);
  $('winStat').textContent='Ходов отряда: '+turns+' · опыт +'+XP_WIN+(ups?' · новый уровень':'');
  $('winLoot').textContent=loot?'Трофей: '+ITEMS[loot].n:'';
  await wipe(()=>{setMode('calm');show('uiBattle',false);show('win',true);scene='win';});
}
async function encounter(){
  if(scene!=='road'||!walking)return;walking=false;setMode('threat');show('uiRoad',false);
  roadFoe.x=1420;roadFoe.alpha=1;shake=10;tw(roadFoe,'x',1060,700);tw(cam,'z',1.12,900);tw(cam,'x',-60,900);
  await wait(650);show('uiShout',true);await wait(1500);
  await wipe(()=>{show('uiShout',false);startBattle();});
}
function startBattle(){
  scene='battle';cam.z=1;cam.x=0;setMode('calm');turn=0;turns=0;foe.max=150+wins*40;foe.hp=foe.max;foe.alpha=1;foe.oy=0;foe.ox=0;foe.pose='idle';
  scroll=305;heroes.forEach(h=>{h.hp=h.max;h.pose='idle';h.ox=0;});show('uiBattle',true);paintUI();setTimeout(next,480);
}
function toRoad(){wipe(()=>{show('win',false);show('uiRoad',true);scene='road';walking=true;roadFoe.alpha=0;setMode('calm');});}
addEventListener('keydown',e=>{
  const k=e.key;if([' ','ArrowUp','ArrowDown','Enter'].includes(k))e.preventDefault();
  const kI='iIшШ'.includes(k);
  if(sheetOpen){if(k==='Escape'||kI)closeSheet();else if(k==='ArrowLeft'||k==='ArrowRight'){shI=(shI+(k==='ArrowLeft'?heroes.length-1:1))%heroes.length;shSlot=null;paintSheet();}return;}
  if(kI)return openSheet();
  if(scene==='road'&&walking&&'xXчЧ'.includes(k)){heroes.forEach(h=>gainXp(h,XP_WIN));sfxs.push({text:'ОПЫТ +'+XP_WIN,x:640,y:300,size:64,rot:-.08,t0:time,dur:.8});return;}
  if(k==='t'||k==='T'||k==='е'||k==='Е'){setMode(mode==='calm'?'threat':'calm');return;}
  if(k==='b'||k==='B'||k==='и'||k==='И'){useGenBg=!useGenBg;return;}
  if(scene==='road'&&(k===' '||k==='Enter'))return encounter();
  if(scene==='win'&&(k===' '||k==='Enter'))return toRoad();
  if(scene==='battle'&&!busy){if(k==='ArrowUp'){sel=(sel+3)%4;paintMenu();}if(k==='ArrowDown'){sel=(sel+1)%4;paintMenu();}if(k==='Enter'||k===' ')choose();}
});
cv.addEventListener('click',()=>{if(scene==='road')encounter();});
$('win').addEventListener('click',()=>{if(scene==='win')toRoad();});
window.__dbg={openSheet,closeSheet,bag,gainXp,genBg(v){useGenBg=v;},encounter,startBattle,setMode,get scene(){return scene;},foe,heroes};

buildUI();
Promise.race([Promise.all([document.fonts.load('40px "Dela Gothic One"','ТРАКТ'),document.fonts.load('700 16px Oswald','Тракт')]),wait(2500)])
  .catch(()=>{}).then(()=>{T0=performance.now();requestAnimationFrame(loop);});
</script>
